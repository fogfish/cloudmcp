##
## Unit Tests & Coverage
##
name: check
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "pkg/auth"]


    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/checkout@v4

      - name: go build
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
    
      - name: go test
        working-directory: ${{ matrix.module }}
        run: |
          go test -coverprofile=profile.cov $(go list ./... | grep -v /examples/)

      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          working-directory: ${{ matrix.module }}
          path-to-profile: profile.cov
          flag-name: ${{ matrix.module }}
          parallel: true

      - uses: dominikh/staticcheck-action@v1.4.0
        with:
          install-go: false
          working-directory: ${{ matrix.module }}

  ##
  ## Consumers resolve newer dependencies by minimum version selection,
  ## the library must build and pass tests against the latest minor versions.
  latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "pkg/auth"]

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/checkout@v4

      - name: go get -u
        working-directory: ${{ matrix.module }}
        run: |
          go get -u ./...
          go mod tidy

      - name: go build
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: |
          go test $(go list ./... | grep -v /examples/)

  finish:
      needs: unit
      runs-on: ubuntu-latest
      steps:
        - uses: shogo82148/actions-goveralls@v1
          with:
            parallel-finished: true
